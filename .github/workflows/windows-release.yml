name: Windows Release

on:
  push:
    branches: [ main ]
    paths:
      - 'src/EngineWriter.Desktop/**'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained EXE
        shell: pwsh
        run: |
          dotnet publish src/EngineWriter.Desktop/EngineWriter.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist

      - name: Package
        shell: pwsh
        run: |
          Copy-Item dist/EngineWriter.exe EngineWriter.exe
          Compress-Archive -Path EngineWriter.exe -DestinationPath EngineWriter-Windows-x64.zip -Force

      - name: Create rolling GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "preview-${{ github.run_number }}"
          gh release create $tag EngineWriter-Windows-x64.zip EngineWriter.exe `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Engine Writer Preview ${{ github.run_number }}" `
            --notes "Standalone Windows preview. No Unity installation required."
