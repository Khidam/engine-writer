name: Prince Titan Unity Windows Release

on:
  push:
    branches: [ main ]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/prince-titan-unity-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prince-titan-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build PrinceTitan.exe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

    steps:
      - name: Check Unity Personal license
        shell: bash
        run: |
          missing=0
          if [ -z "$UNITY_LICENSE" ]; then echo "::error::Add the UNITY_LICENSE secret containing Unity_lic.ulf"; missing=1; fi
          exit $missing

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare local Unity license
        shell: bash
        run: |
          mkdir -p .unity-ci
          printf '%s' "$UNITY_LICENSE" > .unity-ci/Unity_lic.ulf
          test -s .unity-ci/Unity_lic.ulf
          if grep -q '<DeveloperData Value="' .unity-ci/Unity_lic.ulf; then
            echo "Using raw Unity ULF content."
          elif printf '%s' "$UNITY_LICENSE" | base64 --decode > .unity-ci/Unity_lic.decoded.ulf 2>/dev/null && test -s .unity-ci/Unity_lic.decoded.ulf; then
            mv .unity-ci/Unity_lic.decoded.ulf .unity-ci/Unity_lic.ulf
            echo "Decoded base64 Unity ULF content."
          else
            echo "::error::UNITY_LICENSE is neither raw ULF content nor valid base64 ULF content."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: PrinceTitan-Library-2022.3.62f1-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            PrinceTitan-Library-2022.3.62f1-Windows-
            PrinceTitan-Library-

      - name: Build Unity Windows x64
        id: unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildMethod: PrinceTitan.Editor.PrinceTitanBuild.BuildWindows64
          buildsPath: build
          buildName: PrinceTitan
          allowDirtyBuild: true
          versioning: Semantic
          skipActivation: true
          customParameters: -manualLicenseFile /github/workspace/.unity-ci/Unity_lic.ulf

      - name: Verify and package app
        shell: bash
        run: |
          test -f build/StandaloneWindows64/PrinceTitan.exe
          cp README.md build/StandaloneWindows64/README.txt
          cd build/StandaloneWindows64
          zip -9 -r ../../PrinceTitan-Windows-x64.zip .
          cd ../..
          ls -lh PrinceTitan-Windows-x64.zip build/StandaloneWindows64/PrinceTitan.exe

      - name: Keep downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrinceTitan-Windows-x64
          path: PrinceTitan-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="prince-titan-v0.1.${{ github.run_number }}"
          gh release create "$tag" PrinceTitan-Windows-x64.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Prince Titan v0.1.${{ github.run_number }}" \
            --notes "Unity Windows x64 preview. Download the ZIP, extract it, and double-click PrinceTitan.exe. Includes the manuscript editor, local autosave/export, living influence atlas, moving aircraft and robot traffic, markets, estates, companies, and the biological/political lineage tree."

      - name: Remove temporary license file
        if: always()
        shell: bash
        run: rm -f .unity-ci/Unity_lic.ulf .unity-ci/Unity_lic.decoded.ulf
