name: Prince Titan Unity Windows Release

on:
  push:
    branches: [ main ]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/prince-titan-unity-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prince-titan-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build PrinceTitan.exe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Check Unity Personal activation
        shell: bash
        run: |
          missing=0
          if [ -z "$UNITY_LICENSE" ]; then echo "::error::Add the UNITY_LICENSE secret containing Unity_lic.ulf"; missing=1; fi
          if [ -z "$UNITY_EMAIL" ]; then echo "::error::Add the UNITY_EMAIL secret"; missing=1; fi
          if [ -z "$UNITY_PASSWORD" ]; then echo "::error::Add the UNITY_PASSWORD secret"; missing=1; fi
          if [[ "$UNITY_LICENSE" != *'<DeveloperData Value="'* ]]; then
            echo "::error::UNITY_LICENSE must contain the raw XML text from Unity_lic.ulf, not the file path, filename, or encoded data."
            missing=1
          fi
          exit $missing

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: PrinceTitan-Library-2022.3.62f1-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            PrinceTitan-Library-2022.3.62f1-Windows-
            PrinceTitan-Library-

      - name: Build Unity Windows x64
        id: unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildMethod: PrinceTitan.Editor.PrinceTitanBuild.BuildWindows64
          buildsPath: build
          buildName: PrinceTitan
          allowDirtyBuild: true
          versioning: Semantic

      - name: Verify and package app
        shell: bash
        run: |
          test -f build/StandaloneWindows64/PrinceTitan.exe
          test -f build/StandaloneWindows64/PrinceTitan_Data/resources.assets
          extracted_bytes=$(du -sb build/StandaloneWindows64 | cut -f1)
          extracted_megabytes=$((extracted_bytes / 1024 / 1024))
          echo "Extracted application size: ${extracted_megabytes} MB"
          if [ "$extracted_megabytes" -lt 180 ]; then
            echo "::error::The rebuilt application is missing its full-resolution cinematic rooms (${extracted_megabytes} MB found)."
            exit 1
          fi
          cp README.md PrinceTitan-README.txt
          cd build/StandaloneWindows64
          zip -9 -r ../../PrinceTitan-Windows-x64.zip .
          cd ../..
          zip -9 -j PrinceTitan-Windows-x64.zip PrinceTitan-README.txt
          ls -lh PrinceTitan-Windows-x64.zip build/StandaloneWindows64/PrinceTitan.exe

      - name: Keep downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrinceTitan-Windows-x64
          path: PrinceTitan-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="prince-titan-v0.1.${{ github.run_number }}"
          gh release create "$tag" PrinceTitan-Windows-x64.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Prince Titan v0.1.${{ github.run_number }}" \
            --notes "Prince Titan 0.3 — reconstrução completa em Unity para Windows x64. Seis salas independentes com tipografia grande e escala de 100–175%; Sala de Comando cinematográfica; Mapa Vivo em tela ampla com zoom, arraste, aeronaves, Titãs, lugares e influência; máquina física de escrita; árvore de pessoas e famílias; quatro poderes com regiões próprias; economia com mercados, companhias, casas, portos e fábricas; criação de pessoas e lugares; simulação, ambiente sonoro, autosave e exportação. Baixe o ZIP, extraia e abra PrinceTitan.exe."
